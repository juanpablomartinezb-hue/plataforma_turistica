
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso administrativo | EXPLORA</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .contenedor {
      background: white;
      width: 100%;
      max-width: 400px;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    h1, h2 {
      text-align: center;
      color: #173b66;
    }

    p {
      color: #64748b;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      background: #173b66;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #mensaje {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .recuperar {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #173b66;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main class="contenedor">
    <h1>EXPLORA.</h1>
    <h2>Acceso administrativo</h2>

    <p>Ingresa con tu correo electrónico y contraseña.</p>

    <form id="formLogin">

      <label for="correo">Correo electrónico</label>
      <input
        type="email"
        id="correo"
        required
        autocomplete="username"
        placeholder="Tu correo electrónico"
      >

      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        required
        autocomplete="current-password"
        placeholder="Tu contraseña"
      >

      <button type="submit" id="btnEntrar">
        Iniciar sesión
      </button>

    </form>

    <a class="recuperar" href="./restablecer-password.html">
  ¿Olvidaste tu contraseña?
</a>

    <div id="mensaje"></div>
  </main>

  <script>
    const mensaje = document.getElementById("mensaje");
    const formulario = document.getElementById("formLogin");
    const boton = document.getElementById("btnEntrar");

    let cliente = null;

    if (
      window.supabase &&
      window.SUPABASE_URL &&
      window.SUPABASE_PUBLISHABLE_KEY
    ) {
      cliente = window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_PUBLISHABLE_KEY
      );
    } else {
      mensaje.textContent =
        "No se pudo cargar la conexión con Supabase.";
      boton.disabled = true;
    }
document.getElementById("btnRecuperar").addEventListener("click", async (event) => {
  event.preventDefault();

  if (!cliente) return;

  const correo = document.getElementById("correo").value.trim();

  if (!correo) {
    mensaje.textContent = "Escribe tu correo electrónico para recuperar tu contraseña.";
    document.getElementById("correo").focus();
    return;
  }

  mensaje.textContent = "Enviando solicitud de recuperación...";

  try {
    const { error } = await cliente.auth.resetPasswordForEmail(correo, {
      redirectTo: "https://plataformaturistica.vercel.app/admin/restablecer-password.html"
    });

    if (error) throw error;

    mensaje.textContent = "Solicitud enviada. Revisa tu correo y la carpeta de spam.";

  } catch (error) {
    mensaje.textContent = "No se pudo enviar el correo: " + error.message;
  }
});
    formulario.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!cliente) return;

      boton.disabled = true;
      boton.textContent = "Verificando...";
      mensaje.textContent = "";

      const correo = document.getElementById("correo").value.trim();
      const password = document.getElementById("password").value;

      try {
        const { data, error } =
          await cliente.auth.signInWithPassword({
            email: correo,
            password: password
          });

        if (error) throw error;

        const { data: roles, error: errorRoles } =
          await cliente
            .from("platform_user_roles")
            .select("role, is_active")
            .eq("user_id", data.user.id)
            .eq("role", "platform_admin")
            .eq("is_active", true);

        if (errorRoles) throw errorRoles;

        if (!roles || roles.length === 0) {
          await cliente.auth.signOut();
          throw new Error(
            "Tu cuenta no tiene permisos de administrador."
          );
        }

        mensaje.textContent = "Acceso autorizado. Entrando...";

        window.location.href = "./proveedores.html";

      } catch (error) {
        mensaje.textContent =
          "No fue posible iniciar sesión: " + error.message;

        boton.disabled = false;
        boton.textContent = "Iniciar sesión";
      }
    });
  </script>

</body>
</html>
