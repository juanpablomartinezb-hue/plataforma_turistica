
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña | EXPLORA</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .contenedor {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      color: #172b4d;
    }

    h2 {
      font-size: 21px;
    }

    p {
      color: #64748b;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      background: #173b66;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #mensaje {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .oculto {
      display: none;
    }

    .volver {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #173b66;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main class="contenedor">
    <h1>EXPLORA.</h1>

    <h2>Restablecer contraseña</h2>

    <p>Escribe y confirma tu nueva contraseña para acceder al administrador.</p>

    <form id="formPassword" class="oculto">

      <label for="password">Nueva contraseña</label>
      <input
        type="password"
        id="password"
        minlength="8"
        required
        autocomplete="new-password"
        placeholder="Mínimo 8 caracteres"
      >

      <label for="confirmarPassword">Confirmar contraseña</label>
      <input
        type="password"
        id="confirmarPassword"
        minlength="8"
        required
        autocomplete="new-password"
        placeholder="Repite tu contraseña"
      >

      <button type="submit" id="btnGuardar">
        Guardar nueva contraseña
      </button>

    </form>

    <div id="mensaje" role="status" aria-live="polite">
      Verificando el enlace de recuperación...
    </div>

    <a class="volver" href="./login.html">
      Volver al inicio de sesión
    </a>
  </main>

  <script>
    const formulario = document.getElementById("formPassword");
    const mensaje = document.getElementById("mensaje");
    const boton = document.getElementById("btnGuardar");

    let sesionValida = false;

    // Crear correctamente la conexión con Supabase
    if (
      !window.supabase ||
      !window.SUPABASE_URL ||
      !window.SUPABASE_PUBLISHABLE_KEY
    ) {
      mensaje.textContent =
        "No se pudo inicializar la conexión con Supabase.";
      throw new Error("Configuración de Supabase incompleta.");
    }

    const cliente = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
  flowType: "implicit",
  detectSessionInUrl: true,
  persistSession: true,
  autoRefreshToken: true
}
    );

    function mostrarFormulario() {
      sesionValida = true;
      formulario.classList.remove("oculto");
      mensaje.textContent =
        "Enlace válido. Ya puedes establecer tu nueva contraseña.";
    }

    // Detectar cuando Supabase valida la recuperación
    cliente.auth.onAuthStateChange((evento, session) => {
      if (evento === "PASSWORD_RECOVERY" && session) {
        mostrarFormulario();
      }
    });

    async function verificarSesion() {
      try {
        const parametros = new URLSearchParams(
          window.location.search
        );

        const fragmento = new URLSearchParams(
          window.location.hash.substring(1)
        );

        const hayError =
          parametros.has("error") ||
          fragmento.has("error");

        if (hayError) {
          throw new Error(
            "El enlace ha expirado o no es válido. Solicita uno nuevo."
          );
        }

        const esEnlaceRecuperacion =
          fragmento.get("type") === "recovery" ||
          parametros.has("code");

        if (!esEnlaceRecuperacion) {
          throw new Error(
            "No se detectó un enlace de recuperación. Solicita uno nuevo."
          );
        }

        const { data, error } = await cliente.auth.getSession();

        if (error) throw error;

        if (!data.session) {
          throw new Error(
            "No se pudo validar tu enlace. Solicita uno nuevo."
          );
        }

        mostrarFormulario();

      } catch (error) {
        mensaje.textContent = error.message;
      }
    }

    formulario.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!sesionValida) {
        mensaje.textContent =
          "El enlace de recuperación no es válido.";
        return;
      }

      const password =
        document.getElementById("password").value;

      const confirmar =
        document.getElementById("confirmarPassword").value;

      if (password.length < 8) {
        mensaje.textContent =
          "La contraseña debe tener al menos 8 caracteres.";
        return;
      }

      if (password !== confirmar) {
        mensaje.textContent =
          "Las contraseñas no coinciden.";
        return;
      }

      boton.disabled = true;
      boton.textContent = "Guardando...";

      try {
        const { error } = await cliente.auth.updateUser({
          password: password
        });

        if (error) throw error;

        formulario.classList.add("oculto");

        mensaje.textContent =
          "¡Contraseña actualizada correctamente! Ya puedes iniciar sesión con tu nueva contraseña.";

        await cliente.auth.signOut({ scope: "global" });

      } catch (error) {
        mensaje.textContent =
          "No se pudo actualizar la contraseña: " +
          error.message;

        boton.disabled = false;
        boton.textContent = "Guardar nueva contraseña";
      }
    });

    verificarSesion();
  </script>

</body>
</html>
