
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña | EXPLORA</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .contenedor {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      color: #172b4d;
    }

    p {
      color: #64748b;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      background: #173b66;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #mensaje {
      margin-top: 18px;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .oculto {
      display: none;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
</head>

<body>

  <main class="contenedor">
    <h1>EXPLORA.</h1>

    <h2>Restablecer contraseña</h2>

    <p>Escribe tu nueva contraseña para acceder al administrador.</p>

    <form id="formPassword" class="oculto">

      <label for="password">Nueva contraseña</label>
      <input
        type="password"
        id="password"
        minlength="8"
        required
        autocomplete="new-password"
        placeholder="Mínimo 8 caracteres"
      >

      <label for="confirmarPassword">Confirmar contraseña</label>
      <input
        type="password"
        id="confirmarPassword"
        minlength="8"
        required
        autocomplete="new-password"
        placeholder="Repite tu contraseña"
      >

      <button type="submit" id="btnGuardar">
        Guardar nueva contraseña
      </button>

    </form>

    <div id="mensaje">Verificando el enlace de recuperación...</div>
  </main>

  <script>
    const formulario = document.getElementById("formPassword");
    const mensaje = document.getElementById("mensaje");
    const boton = document.getElementById("btnGuardar");

    let cliente = window.supabaseClient;
    let sesionValida = false;

    async function verificarSesion() {
      try {
        if (!cliente) {
          throw new Error("No se pudo inicializar Supabase.");
        }

        const { data, error } = await cliente.auth.getSession();

        if (error) throw error;

        if (data.session) {
          sesionValida = true;
          formulario.classList.remove("oculto");
          mensaje.textContent = "Enlace válido. Puedes establecer tu contraseña.";
        } else {
          mensaje.textContent =
            "No se encontró una sesión de recuperación válida. Solicita un nuevo enlace.";
        }

      } catch (error) {
        mensaje.textContent = "Error: " + error.message;
      }
    }

    cliente.auth.onAuthStateChange((evento, session) => {
      if (evento === "PASSWORD_RECOVERY" && session) {
        sesionValida = true;
        formulario.classList.remove("oculto");
        mensaje.textContent = "Enlace válido. Puedes establecer tu contraseña.";
      }
    });

    formulario.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!sesionValida) {
        mensaje.textContent = "La sesión de recuperación no es válida.";
        return;
      }

      const password = document.getElementById("password").value;
      const confirmar = document.getElementById("confirmarPassword").value;

      if (password.length < 8) {
        mensaje.textContent = "La contraseña debe tener al menos 8 caracteres.";
        return;
      }

      if (password !== confirmar) {
        mensaje.textContent = "Las contraseñas no coinciden.";
        return;
      }

      boton.disabled = true;
      boton.textContent = "Guardando...";

      try {
        const { error } = await cliente.auth.updateUser({
          password: password
        });

        if (error) throw error;

        formulario.classList.add("oculto");
        mensaje.textContent =
          "¡Contraseña actualizada correctamente! Ya puedes entrar al administrador.";

      } catch (error) {
        mensaje.textContent = "No se pudo actualizar la contraseña: " + error.message;
        boton.disabled = false;
        boton.textContent = "Guardar nueva contraseña";
      }
    });

    verificarSesion();
  </script>

</body>
</html>
