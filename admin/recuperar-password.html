
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña | EXPLORA</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f4f6f8;
      font-family: Arial, sans-serif;
      color: #263238;
    }

    .contenedor {
      width: 100%;
      max-width: 420px;
      padding: 36px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 25px;
    }

    .descripcion {
      color: #68747d;
      line-height: 1.5;
      margin-bottom: 26px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd3d9;
      border-radius: 7px;
      font-size: 16px;
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 7px;
      background: #183d50;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #mensaje {
      margin-top: 18px;
      line-height: 1.5;
      font-size: 14px;
    }

    .volver {
      display: block;
      margin-top: 24px;
      text-align: center;
      color: #183d50;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main class="contenedor">
    <h1>Recuperar contraseña</h1>

    <p class="descripcion">
      Escribe el correo electrónico asociado a tu cuenta.
      Te enviaremos un enlace para crear una nueva contraseña.
    </p>

    <form id="formRecuperar">
      <label for="correo">Correo electrónico</label>

      <input
        type="email"
        id="correo"
        required
        autocomplete="email"
        placeholder="Tu correo electrónico"
      >

      <button type="submit" id="btnRecuperar">
        Recuperar contraseña
      </button>
    </form>

    <div id="mensaje" role="status" aria-live="polite"></div>

    <a class="volver" href="./login.html">
      Volver al inicio de sesión
    </a>
  </main>

  <script>
    const cliente = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_PUBLISHABLE_KEY
    );

    const formulario = document.getElementById("formRecuperar");
    const boton = document.getElementById("btnRecuperar");
    const mensaje = document.getElementById("mensaje");

    formulario.addEventListener("submit", async (event) => {
      event.preventDefault();

      const correo = document.getElementById("correo").value.trim();

      if (!correo) return;

      boton.disabled = true;
      boton.textContent = "Enviando...";
      mensaje.textContent = "";

      try {
        const { error } = await cliente.auth.resetPasswordForEmail(
          correo,
          {
            redirectTo:
              "https://plataformaturistica.vercel.app/admin/restablecer-password.html"
          }
        );

        if (error) throw error;

        mensaje.textContent =
          "Si el correo corresponde a una cuenta registrada, recibirás un enlace para recuperar tu contraseña. Revisa también el correo no deseado.";

      } catch (error) {
        mensaje.textContent =
          "No se pudo procesar la solicitud. Inténtalo más tarde.";

        console.error("Error de recuperación:", error);

      } finally {
        boton.disabled = false;
        boton.textContent = "Recuperar contraseña";
      }
    });
  </script>

</body>
</html>
